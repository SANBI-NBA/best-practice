# ============================================================
# Indicator assessment metadata
# ============================================================
# This file records the code, input data and outputs associated
# with a specific indicator assessment.
#
# Update this file for each assessment and commit it with the
# corresponding code release.
#
# As this is YAML format, be sure to maintain indentations to
# maintain code functionality.
#
# ============================================================


# ------------------------------------------------------------
# Assessment information
# ------------------------------------------------------------

assessment:

  # Stable identifier for this assessment.
  # Use a convention that will remain unique across assessments.
  id: "indicator-name-YYYY-MM-DD"
  
  # Name of the indicator being assessed.
  indicator: "Indicator name"

 # Purpose or reporting process for which the assessment
  # was undertaken.
  # Examples:
  # - National Biodiversity Assessment
  # - CBD National Report
  # - SDG reporting
  # - NBSAP progress assessment
  assessment_for: "Reporting process or assessment"
  
  # Date on which the assessment was completed.
  assessment_date: "YYYY-MM-DD"
  
  # Location where the official assessment outputs are published.
  # This may be a DOI, institutional repository, website,
  # database record or report URL.
  published_at: "https://..."
  
  # Optional notes explaining anything unusual about this
  # assessment or changes from the previous assessment.
  notes: 
  
# ------------------------------------------------------------
# Code version
# ------------------------------------------------------------

code:

  # Repository containing the analytical workflow.
  repository: "https://github.com/organisation/repository"

  # Git release/tag used for this assessment.
  release_tag: "v1.0.0"

  # Optional version of the assessment method, where this is
  # distinct from the software/code version. Update method version
  # when there are substantial changes to the way the indicator is computed.
  method_version: "1.0"
  
# ------------------------------------------------------------
# Input data
# ------------------------------------------------------------

input_data:
  
    # Give each input dataset a unique ID. Repeat this block
    # for each input dataset
    - id: "dataset_01"
    
      # Provide the name of the data source - a database or spatial layer that is maintained
      # independently from the assessment where you have obtained your input data from
      data_source: "National Integrated Ecosystem Map"
      
      # File extracted from the source dataset and used in this assessment
      file: "marine_ecosystems.gpkg"
      
      # Location of the input data file
      location: "data-repository-name/folder"
      
      # Date on which the assessment input file was extracted
      # from the source dataset
      extraction_date: "2026-06-30"

# ------------------------------------------------------------
# Assessment outputs
# ------------------------------------------------------------

outputs:

  # Repeat this code block for each output connected to this assessment
  - id: "indicator_results"

    # Description of the output.
    name: "Indicator assessment results"

    # Filename produced by the assessment workflow.
    file: "indicator_results.csv"

    # Location of the assessment output.
    location: "outputs/YYYY/indicator_results.csv"

    # Optional publication location where this particular output
    # can be accessed externally.
    published_at: "https://..."
  